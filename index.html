<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Νέα Τιμολόγηση</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f8f9fa; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #1976d2; margin-bottom: 30px; }
        .form-grid { display: grid; grid-template-columns: 160px 1fr; gap: 15px; align-items: center; }
        label { font-weight: 600; color: #444; text-align: right; font-size: 0.9em; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; background: #fff; }
        #coversContainer { grid-column: 2; border: 1px solid #ddd; border-radius: 4px; background: #fff; max-height: 200px; overflow-y: auto; padding: 5px; }
        .cover-item { display: flex; align-items: center; padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        .btn-main { grid-column: span 2; background: #1976d2; color: white; border: none; padding: 15px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-main:disabled { background: #9e9e9e; }
    </style>
</head>
<body>

<div class="container">
    <h2>Νέα Τιμολόγηση</h2>
    <form id="quoteForm" class="form-grid">
        <label>Αρ.Κυκλοφορίας:</label> <input type="text" id="plate" name="plate" required>
        <label>Διάρκεια:</label> <select id="duration" name="duration"></select>
        <label>Χρήση:</label> <select id="usage" name="usage"></select>
        <label>Εργοστάσιο:</label> <select id="factory" name="factory"></select>
        <label>Μοντέλο:</label> <select id="model" name="model"></select>
        <label>Τ.Κ.:</label> <input type="text" id="zip" name="zip">
        <label>ΑΦΜ:</label> <input type="text" id="afm" name="afm" maxlength="9">
        <label>Ημ. Γέννησης:</label> <input type="date" id="dob" name="dob">
        <label>Ημ. Διπλώματος:</label> <input type="date" id="license_date" name="license_date">
        <label>Ημ. 1ης Αδείας:</label> <input type="date" id="first_reg" name="first_reg">
        <label>Ημ. Απόκτησης:</label> <input type="date" id="acquisition" name="acquisition">
        <label>Φ.Ιπποι:</label> <input type="text" id="thp" name="thp">
        <label>KW:</label> <input type="text" id="kw" name="kw">
        <label>Αξία οχήματος:</label> <input type="number" id="value" name="value" min="0">
        
        <label>Πακέτο:</label> <select id="package" name="package"></select>
        <label>Καλύψεις:</label> 
        <div id="coversContainer">Επιλέξτε πακέτο...</div>
        <input type="hidden" id="covers" name="covers">

        <button type="submit" id="submitBtn" class="btn-main">Αποθήκευση</button>
        <div id="statusBox" style="display:none; margin-top:20px; padding:15px; border-radius:8px; background:#f1f8ff; border:1px solid #90caf9;"></div>
    </form>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzSQrlsy4053DBrOz0r8yy16WUtRwH2LRxjiwkGv3_eoLEN45Al945SU_Sj-wBxRHIb/exec";
    let checkTimer = null;

    // --- ΒΟΗΘΗΤΙΚΕΣ ΣΥΝΑΡΤΗΣΕΙΣ ---
    function formatData(data) {
        if (data.afm) data.afm = String(data.afm).trim().padStart(9, '0');
        ['dob', 'license_date', 'first_reg', 'acquisition'].forEach(field => {
            if (data[field]) {
                const [y, m, d] = data[field].split('-');
                data[field] = `${d}/${m}/${y}`;
            }
        });
        return data;
    }

    // --- SUBMIT ΦΟΡΜΑΣ ---
    document.getElementById("quoteForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("submitBtn");
        let data = Object.fromEntries(new FormData(e.target).entries());
        data = formatData(data);
        
        btn.disabled = true;
        btn.textContent = "Αποστολή...";

        try {
            const response = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(data) });
            const result = await response.json();
            if(result.status === "success") {
                document.getElementById("statusBox").style.display = "block";
                document.getElementById("statusBox").innerHTML = "✅ Η αίτηση καταχωρήθηκε.\n\n🟡 Η τιμολόγηση ξεκίνησε...";
                localStorage.setItem("lastPlate", data.plate);
                e.target.reset();
                if(checkTimer) clearInterval(checkTimer);
                checkTimer = setInterval(checkResult, 10000);
            } else {
                alert("Σφάλμα: " + result.message);
            }
        } catch(err) { console.error(err); alert("Σφάλμα σύνδεσης."); }
        finally { btn.disabled = false; btn.textContent = "Αποθήκευση"; }
    });

    // --- DROPDOWNS ---
    async function loadDropdown(action, elementId) {
        try {
            const response = await fetch(`${SCRIPT_URL}?action=${action}`);
            const data = await response.json();
            const select = document.getElementById(elementId);
            select.innerHTML = '<option value="">-Επιλέξτε-</option>';
            data.forEach(item => {
                let opt = document.createElement("option");
                opt.value = item; opt.textContent = item;
                select.appendChild(opt);
            });
        } catch (e) { console.error("Error loading " + action, e); }
    }

    async function loadModels() {
        const factory = document.getElementById("factory").value;
        const modelSelect = document.getElementById("model");
        if(!factory) return;
        try {
            const response = await fetch(`${SCRIPT_URL}?action=models&factory=${encodeURIComponent(factory)}`);
            const models = await response.json();
            modelSelect.innerHTML = '<option value="">-Επιλέξτε-</option>';
            models.forEach(item => {
                let opt = document.createElement("option");
                opt.value = item.model;
                opt.textContent = `${item.model} (${item.engine}cc / ${item.power}hp)`;
                modelSelect.appendChild(opt);
            });
        } catch(e) { console.error(e); }
    }

    async function loadCovers() {
        const pkg = document.getElementById("package").value;
        const container = document.getElementById("coversContainer");
        if(!pkg) { container.innerHTML = 'Επιλέξτε πακέτο...'; return; }
        try {
            const response = await fetch(`${SCRIPT_URL}?action=covers&package=${encodeURIComponent(pkg)}`);
            const covers = await response.json();
            container.innerHTML = "";
            covers.forEach(item => {
                container.insertAdjacentHTML('beforeend', `<label class="cover-item"><input type="checkbox" class="coverCheck" value="${item}" onchange="updateCovers()"> <span>${item}</span></label>`);
            });
        } catch(e) { console.error(e); }
    }

    function updateCovers() {
        const selected = Array.from(document.querySelectorAll(".coverCheck:checked")).map(i => i.value);
        document.getElementById("covers").value = selected.join(", ");
    }

    // --- CHECK RESULT ---
    async function checkResult() {
        const plate = localStorage.getItem("lastPlate");
        if(!plate) return;
        try {
            const response = await fetch(SCRIPT_URL + "?plate=" + encodeURIComponent(plate));
            const data = await response.json();
            const box = document.getElementById("statusBox");
            if(data.status === "Προς Τιμολόγηση") {
                box.innerHTML = "🟡 Η τιμολόγηση εκτελείται για: " + plate;
            } else if(data.results) {
                clearInterval(checkTimer);
                box.innerHTML = "✅ Η τιμολόγηση ολοκληρώθηκε\n\n" + data.results;
            }
        } catch (err) { console.error(err); }
    }

    // --- INIT ---
    ["factory", "usage", "duration", "package"].forEach(id => loadDropdown(id, id));
    document.getElementById("factory").addEventListener("change", loadModels);
    document.getElementById("package").addEventListener("change", loadCovers);
</script>
</body>
</html>
