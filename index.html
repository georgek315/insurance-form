<!DOCTYPE html>
<html lang="el">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Νέα Τιμολόγηση</title>


<style>

body {

    font-family: Arial, sans-serif;

    background:#f5f5f5;

    padding:20px;

}


.container {

    max-width:500px;

    margin:auto;

    background:white;

    padding:25px;

    border-radius:10px;

}


input, select, textarea {

    width:100%;

    padding:10px;

    margin-top:5px;

    margin-bottom:15px;

}


button {

    width:100%;

    padding:15px;

    background:#1976d2;

    color:white;

    border:none;

    border-radius:8px;

    font-size:18px;

}


label {

    font-weight:bold;

}


</style>

</head>


<body>


<div class="container">


<h2>
Νέα Τιμολόγηση
</h2>



<label>
Πινακίδα
</label>

<input id="plate">



<label>
ΑΦΜ
</label>

<input id="afm">



<label>
Ημερομηνία γέννησης
</label>

<input id="dob" placeholder="πχ 01/01/1980">



<label>
Ημερομηνία διπλώματος
</label>

<input id="license_date">



<label>
Πρώτη κυκλοφορία
</label>

<input id="first_reg">



<label>
Ημερομηνία αγοράς
</label>

<input id="acquisition">



<label>
Κυβικά
</label>

<input id="thp">



<label>
KW
</label>

<input id="kw">



<label>
Αξία οχήματος
</label>

<input id="value">



<label>
Πακέτο
</label>

<select id="package">

<option value="BASIC">
BASIC
</option>

<option value="FULL">
FULL
</option>

</select>



<label>
Καλύψεις
</label>

<textarea id="covers"
placeholder="πχ Οδική βοήθεια, Θραύση κρυστάλλων">
</textarea>



<button onclick="sendData()">

ΤΙΜΟΛΟΓΗΣΗ

</button>



</div>


<script>


const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzM4Wx7cto79p_Ua9YFzuhZGdSNWhrq3B3K4Wuq2mMqApi8jOCV1IDeDLJInHQJ0fK7/exec";


async function sendData(){


    const data = {

        plate: document.getElementById("plate").value,

        afm: document.getElementById("afm").value,

        dob: document.getElementById("dob").value,

        license_date: document.getElementById("license_date").value,

        first_reg: document.getElementById("first_reg").value,

        acquisition: document.getElementById("acquisition").value,

        thp: document.getElementById("thp").value,

        kw: document.getElementById("kw").value,

        value: document.getElementById("value").value,

        package: document.getElementById("package").value,

        covers: document.getElementById("covers").value,


        // προσωρινές προεπιλογές
        duration: "12",

        usage: "1",

        factory: "",

        model: "",

        zip: "",

        cc: ""

    };


    try {


        let response = await fetch(

            SCRIPT_URL,

            {

                method:"POST",

                body: JSON.stringify(data)

            }

        );


        let result = await response.json();


        if(result.status === "success"){


            alert(
                "✅ Η αίτηση καταχωρήθηκε"
            );


        } else {


            alert(
                "Σφάλμα: " + result.message
            );


        }


    } catch(error){


        alert(
            "Σφάλμα σύνδεσης: " + error
        );


    }

}

</script>


</body>

</html>
