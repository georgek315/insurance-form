<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Νέα Τιμολόγηση</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f8f9fa; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #1976d2; margin-bottom: 30px; }

        /* Grid Layout για το layout του screenshot */
        .form-grid { display: grid; grid-template-columns: 180px 1fr; gap: 15px; align-items: center; }
        
        label { font-weight: 600; color: #444; text-align: right; font-size: 0.9em; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; background: #fffdf0; }
        
        /* Ειδικά styles */
        .row-span { display: flex; gap: 10px; }
        .btn-search { background: #1976d2; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        
        .footer-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 30px; }
        .btn-main { background: #2e7d32; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; }
        .btn-clear { background: #d32f2f; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; }

        /* Mobile responsiveness */
        @media (max-width: 500px) { .form-grid { grid-template-columns: 1fr; } label { text-align: left; } }
    </style>
</head>
<body>

<div class="container">
    <h2>Νέα Τιμολόγηση</h2>
    <form id="quoteForm" class="form-grid">
        
        <!-- Plate section -->
        <label>Αρ.Κυκλοφορίας:</label>
        <div class="row-span">
            <input type="text" id="plate" name="plate" required>
            <button type="button" class="btn-search">Αναζήτηση</button>
        </div>

        <label>Διάρκεια:</label> <select id="duration" name="duration"></select>
        <label>Χρήση:</label> <select id="usage" name="usage"></select>
        <label>Εργοστάσιο:</label> <select id="factory" name="factory"></select>
        <label>Μοντέλο:</label> <select id="model" name="model"></select>
        <label>Τ.Κ.:</label> <input type="text" id="zip" name="zip">
        <label>ΑΦΜ:</label> <input type="text" id="afm" name="afm">
        <label>Ημ. Γέννησης:</label> <input type="date" id="dob" name="dob">
        <label>Ημ. Διπλώματος:</label> <input type="date" id="license_date" name="license_date">
        <label>Ημ. 1ης Αδείας:</label> <input type="date" id="first_reg" name="first_reg">
        <label>Ημ. Απόκτησης:</label> <input type="date" id="acquisition" name="acquisition">
        
        <label>Κυβισμός / Φ.Ιπποι:</label>
        <div class="row-span">
            <input type="text" id="thp" name="thp">
            <input type="text" id="kw" name="kw">
        </div>

        <label>KW:</label> <input type="text" id="kw_field" name="kw_field">
        <label>Αξία οχήματος:</label> <input type="number" id="value" name="value">
        <label>Ιδιότητα:</label> <select id="identity" name="identity"><option>ΦΥΣΙΚΟ ΠΡΟΣΩΠΟ</option></select>

        <!-- Container για καλύψεις που είχαμε πριν -->
        <div style="grid-column: span 2;">
            <label style="text-align: left; display: block; margin-bottom: 10px;">Πακέτο & Καλύψεις</label>
            <select id="package" name="package"></select>
            <div id="coversContainer"></div>
            <input type="hidden" id="covers" name="covers">
        </div>

        <div class="footer-buttons" style="grid-column: span 2;">
            <button type="submit" class="btn-main">Αποθήκευση</button>
            <button type="reset" class="btn-clear">Καθαρισμός</button>
        </div>
    </form>
</div>

    // Ο κώδικας logic παραμένει ίδιος - απλά αντιστοίχισε τα ID στα input fields παραπάνω

</script>
</body>
</html>
