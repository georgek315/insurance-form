<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Νέα Τιμολόγηση</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; padding: 20px; line-height: 1.6; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1976d2; margin-bottom: 25px; }
        label { font-weight: 600; display: block; margin-top: 10px; color: #333; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; margin-top: 20px; background: #1976d2; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #1565c0; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #coversContainer { margin-top: 10px; padding: 10px; border: 1px solid #eee; border-radius: 6px; }
        .cover-item { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>Νέα Τιμολόγηση</h2>
    <form id="quoteForm">
        <label>Πινακίδα</label>
        <input type="text" id="plate" required>

        <label>Διάρκεια</label>
        <select id="duration" required><option value="">-Επιλέξτε-</option></select>

        <label>Χρήση</label>
        <select id="usage" required><option value="">-Επιλέξτε-</option></select>

        <label>Μάρκα</label>
        <select id="factory" required><option value="">-Επιλέξτε-</option></select>

        <label>Μοντέλο</label>
        <select id="model" required><option value="">-Επιλέξτε Μάρκα πρώτα-</option></select>

        <label>ΑΦΜ</label>
        <input type="text" id="afm" maxlength="9" pattern="\d{9}" required>

        <label>Πακέτο</label>
        <select id="package" required><option value="">-Επιλέξτε-</option></select>

        <label>Καλύψεις</label>
        <div id="coversContainer">Επιλέξτε πακέτο για να εμφανιστούν οι καλύψεις</div>
        <input type="hidden" id="covers">

        <button type="submit" id="submitBtn">ΤΙΜΟΛΟΓΗΣΗ</button>
    </form>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbysguM72PFm-nPnYc2fQOozpFn87Ife1IEhD-WSSlcYk1wJZ6RSvnBXv1SiutWftbJ-/exec";

    async function loadDropdown(action, elementId) {
        const select = document.getElementById(elementId);
        try {
            const response = await fetch(`${SCRIPT_URL}?action=${action}`);
            const data = await response.json();
            select.innerHTML = '<option value="">-Επιλέξτε-</option>';
            data.forEach(item => {
                let opt = document.createElement("option");
                opt.value = item; opt.textContent = item;
                select.appendChild(opt);
            });
        } catch (e) { console.error("Error loading " + action, e); }
    }

    async function loadModels() {
        const factory = document.getElementById("factory").value;
        const modelSelect = document.getElementById("model");
        if(!factory) return;

        modelSelect.innerHTML = '<option>Φόρτωση...</option>';
        try {
            const response = await fetch(`${SCRIPT_URL}?action=models&factory=${encodeURIComponent(factory)}`);
            const models = await response.json();
            modelSelect.innerHTML = '<option value="">-Επιλέξτε-</option>';
            models.forEach(item => {
                let opt = document.createElement("option");
                opt.value = item.model;
                opt.textContent = `${item.model} (${item.engine}cc)`;
                modelSelect.appendChild(opt);
            });
        } catch(e) { modelSelect.innerHTML = '<option value="">Σφάλμα φόρτωσης</option>'; }
    }

    async function loadCovers() {
        const pkg = document.getElementById("package").value;
        const container = document.getElementById("coversContainer");
        if(!pkg) { container.innerHTML = "Επιλέξτε πακέτο..."; return; }

        container.innerHTML = "Φόρτωση καλύψεων...";
        const response = await fetch(`${SCRIPT_URL}?action=covers&package=${encodeURIComponent(pkg)}`);
        const covers = await response.json();
        
        container.innerHTML = "";
        covers.forEach(item => {
            container.insertAdjacentHTML('beforeend', `
                <label class="cover-item">
                    <input type="checkbox" class="coverCheck" value="${item}" onchange="updateCovers()"> ${item}
                </label>
            `);
        });
    }

    function updateCovers() {
        const selected = Array.from(document.querySelectorAll(".coverCheck:checked")).map(i => i.value);
        document.getElementById("covers").value = selected.join(", ");
    }

    document.getElementById("quoteForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("submitBtn");
        btn.disabled = true;
        btn.textContent = "Αποστολή...";

        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());

        try {
            const response = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(data) });
            const result = await response.json();
            alert(result.status === "success" ? "✅ Επιτυχία!" : "Σφάλμα: " + result.message);
        } catch(err) { alert("Σφάλμα σύνδεσης."); }
        finally { btn.disabled = false; btn.textContent = "ΤΙΜΟΛΟΓΗΣΗ"; }
    });

    // Initialization
    ["factory", "usage", "duration", "package"].forEach(id => loadDropdown(id, id));
    document.getElementById("factory").addEventListener("change", loadModels);
    document.getElementById("package").addEventListener("change", loadCovers);
</script>
</body>
</html>
