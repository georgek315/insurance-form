<!DOCTYPE html>
<html lang="el">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Νέα Τιμολόγηση</title>


<style>

body {

    font-family: Arial, sans-serif;
    background:#f5f5f5;
    padding:20px;

}


.container {

    max-width:550px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:10px;

}


h2 {

    text-align:center;

}


input, select, textarea {

    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    box-sizing:border-box;

}


textarea {

    height:80px;

}


label {

    font-weight:bold;

}


button {

    width:100%;
    padding:15px;
    background:#1976d2;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;

}


button:hover {

    background:#125aa0;

}

</style>


</head>


<body>


<div class="container">


<h2>
Νέα Τιμολόγηση
</h2>



<label>
Πινακίδα
</label>

<input id="plate">



<label>
Διάρκεια
</label>

<select id="duration">

<option value="">
-Επιλέξατε-
</option>

</select>



<label>
Χρήση
</label>

<select id="usage">

<option value="">
-Επιλέξατε-
</option>

</select>



<label>
Μάρκα
</label>

<select id="factory">

<option value="">
-Επιλέξατε-
</option>

</select>



<label>
Μοντέλο
</label>

<select id="model">

<option value="">
-Επιλέξατε-
</option>

</select>



<label>
ΤΚ
</label>

<input id="zip">



<label>
ΑΦΜ
</label>

<input id="afm">



<label>
Ημερομηνία γέννησης
</label>

<input id="dob" placeholder="πχ 01/01/1980">



<label>
Ημερομηνία διπλώματος
</label>

<input id="license_date">



<label>
Πρώτη κυκλοφορία
</label>

<input id="first_reg">



<label>
Ημερομηνία αγοράς
</label>

<input id="acquisition">



<label>
Κυβικά / THP
</label>

<input id="thp">



<label>
KW
</label>

<input id="kw">


<label>
Αξία οχήματος
</label>

<input id="value">



<label>
Πακέτο
</label>

<select id="package">

<option value="">
-Επιλέξατε-
</option>

</select>



<label>
Καλύψεις
</label>

<textarea 
id="covers"
placeholder="πχ Οδική βοήθεια, Θραύση κρυστάλλων, Νομική προστασία">
</textarea>



<button onclick="sendData()">

ΤΙΜΟΛΟΓΗΣΗ

</button>


</div>



<script>


const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwGoNBxF7RkeGI5xQ3JWklW2XR9_BtSouMgp1Q-eiPLXeCnxrCpKZsHzZLbYoU8_wea/exec";



// =================================
// ΓΕΝΙΚΗ ΦΟΡΤΩΣΗ DROPDOWN
// =================================


async function loadDropdown(action, elementId){


    const response = await fetch(
        SCRIPT_URL + "?action=" + action
    );


    const data = await response.json();


    const select = document.getElementById(
        elementId
    );


    data.forEach(function(item){


        let option = document.createElement(
            "option"
        );


        option.value = item;

        option.textContent = item;


        select.appendChild(option);


    });


}



// =================================
// ΦΟΡΤΩΣΗ ΜΟΝΤΕΛΩΝ
// =================================


async function loadModels(){


    const factory =
        document.getElementById("factory").value;



    const modelSelect =
        document.getElementById("model");



    modelSelect.innerHTML =
        '<option value="">-Επιλέξατε-</option>';



    if(!factory){

        return;

    }



    const response = await fetch(

        SCRIPT_URL +
        "?action=models&factory=" +
        encodeURIComponent(factory)

    );



    const models = await response.json();



    models.forEach(function(item){



        let option =
            document.createElement("option");



        option.value =
            item.model;



        option.textContent =
            item.model +
            " " +
            item.version +
            " (" +
            item.engine +
            "cc / " +
            item.power +
            "hp)";



        modelSelect.appendChild(option);



    });



}



// =================================
// ΑΡΧΙΚΗ ΦΟΡΤΩΣΗ
// =================================


loadDropdown(
    "factory",
    "factory"
);


loadDropdown(
    "usage",
    "usage"
);


loadDropdown(
    "duration",
    "duration"
);


loadDropdown(
    "package",
    "package"
);


loadDropdown(
    "covers",
    "covers"
);



document
.getElementById("factory")
.addEventListener(
    "change",
    loadModels
);


// =================================
// ΑΠΟΣΤΟΛΗ ΣΤΟ GOOGLE SHEET
// =================================


async function sendData(){


const data = {


plate:
document.getElementById("plate").value,


duration:
document.getElementById("duration").value,


usage:
document.getElementById("usage").value,


factory:
document.getElementById("factory").value,


model:
document.getElementById("model").value,


zip:
document.getElementById("zip").value,


afm:
document.getElementById("afm").value,


dob:
document.getElementById("dob").value,


license_date:
document.getElementById("license_date").value,


first_reg:
document.getElementById("first_reg").value,


acquisition:
document.getElementById("acquisition").value,


thp:
document.getElementById("thp").value,


kw:
document.getElementById("kw").value,


value:
document.getElementById("value").value,


package:
document.getElementById("package").value,


covers:
document.getElementById("covers").value

};



try {


const response = await fetch(

SCRIPT_URL,

{

method:"POST",

body:JSON.stringify(data)

}

);



const result =
await response.json();



if(result.status === "success"){


alert(
"✅ Η αίτηση καταχωρήθηκε και πήγε για τιμολόγηση"
);


}



else {


alert(
"Σφάλμα: " + result.message
);


}



}

catch(error){


alert(
"Σφάλμα σύνδεσης: " + error
);


}



}



</script>


</body>

</html>
